name: Screens

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | head -20

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/xg"
          mkdir -p "$P"
          curl -fsSL -o "$RUNNER_TEMP/xg.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/2.43.0/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xg.zip" -d "$RUNNER_TEMP/xgu"
          bash "$RUNNER_TEMP/xgu/xcodegen/install.sh" "$P"
          echo "$P/bin" >> "$GITHUB_PATH"

      - name: Build for simulator
        run: |
          set -euo pipefail
          python3 build_css.py
          xcodegen generate --spec project.yml
          # Собираем один раз: приложение одно и то же для всех экранов.
          xcodebuild -project OpenCodeWeb.xcodeproj -scheme OpenCodeWeb \
            -configuration Debug -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" EXPANDED_CODE_SIGN_IDENTITY="" \
            build

      - name: Launch and screenshot
        env:
          OC_PASSWORD: ${{ secrets.OC_PASSWORD }}
          OC_URL: ${{ secrets.OC_URL }}
        run: |
          set -uo pipefail
          APP=$(find "$RUNNER_TEMP/dd/Build/Products" -name "OpenCode.app" -maxdepth 3 | head -1)
          echo "app: $APP"
          mkdir -p shots

          # Ровно тот размер, что нужен: iPhone 15 Plus (430x932, островок).
          DEVICE_NAME="iPhone 15 Plus"
          SLUG="15plus"

          xcrun simctl list devicetypes | grep -i "iPhone 15 Plus" || true
          if ! xcrun simctl list devices available | grep -q "$DEVICE_NAME ("; then
            TYPE=$(xcrun simctl list devicetypes | grep -i "iPhone 15 Plus" | grep -oE "com\.apple\.CoreSimulator\.SimDeviceType\.[A-Za-z0-9-]+" | head -1)
            RUNTIME=$(xcrun simctl list runtimes | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9-]+" | tail -1)
            echo "создаю $DEVICE_NAME из $TYPE на $RUNTIME"
            xcrun simctl create "$DEVICE_NAME" "$TYPE" "$RUNTIME" || true
          fi
          xcrun simctl list devices | grep -i "15 Plus" || true

          xcrun simctl boot "$DEVICE_NAME" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_NAME" -b 2>/dev/null || true
          xcrun simctl install "$DEVICE_NAME" "$APP"

          # Реальные размеры экрана и безопасных зон — чтобы проверять факты,
          # а не догадки.
          xcrun simctl io "$DEVICE_NAME" screenshot "shots/${SLUG}-0-raw.png" || true

          shoot () {
            local device="$1"; local name="$2"; local extra="$3"; shift 3
            xcrun simctl terminate "$device" dev.opencode2.mobile 2>/dev/null || true
            sleep 1
            SIMCTL_CHILD_OC_PASSWORD="$OC_PASSWORD" \
            SIMCTL_CHILD_OC_URL="${OC_URL:-https://oc.13.143.161.69.sslip.io:8443}" \
            SIMCTL_CHILD_OC_USER=opencode \
            SIMCTL_CHILD_OC_SCREEN="$extra" \
            xcrun simctl launch "$device" dev.opencode2.mobile >/dev/null || true
            local tag=1
            for wait in "$@"; do
              sleep "$wait"
              xcrun simctl io "$device" screenshot "shots/${name}-${tag}.png" || true
              tag=$((tag+1))
            done
          }

          shoot "$DEVICE_NAME" "${SLUG}-a-launch" "launch" 6
          shoot "$DEVICE_NAME" "${SLUG}-b-sessions" "" 10
          shoot "$DEVICE_NAME" "${SLUG}-c-empty" "empty" 20
          shoot "$DEVICE_NAME" "${SLUG}-d-web" "web" 24
          shoot "$DEVICE_NAME" "${SLUG}-f-keyboard" "keyboard" 26

          # Без связи: понятные кнопки вместо бесконечной загрузки.
          xcrun simctl terminate "$DEVICE_NAME" dev.opencode2.mobile 2>/dev/null || true
          sleep 1
          SIMCTL_CHILD_OC_PASSWORD="$OC_PASSWORD" \
          SIMCTL_CHILD_OC_URL="https://127.0.0.1:9" \
          SIMCTL_CHILD_OC_USER=opencode \
          xcrun simctl launch "$DEVICE_NAME" dev.opencode2.mobile >/dev/null || true
          sleep 14
          xcrun simctl io "$DEVICE_NAME" screenshot "shots/${SLUG}-e-offline.png" || true

          ls -lh shots

      - uses: actions/upload-artifact@v4
        with:
          name: screens
          path: shots
          if-no-files-found: warn
